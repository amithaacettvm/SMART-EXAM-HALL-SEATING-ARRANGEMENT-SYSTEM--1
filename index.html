<!DOCTYPE html>
<html>

<head>
    <title>Exam Hall Seating Arrangement System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head>

<body>

<div class="container mt-4">

    <h1 class="text-center mb-4">
        Exam Hall Seating Arrangement System
    </h1>

    <!-- Excel Upload -->

    <div class="card p-4 shadow mb-4">

        <h3>Upload Student Excel Sheet</h3>

        <input
            type="file"
            id="excelFile"
            accept=".xlsx,.xls"
            class="form-control mb-3">

        <button
            class="btn btn-primary"
            onclick="uploadExcel()">

            Upload Students

        </button>

    </div>

    <!-- Student List -->

    <div class="card p-4 shadow mb-4">

        <h3>Imported Students</h3>

        <table class="table table-bordered">

            <thead>

            <tr>
                <th>Registration Number</th>
                <th>Branch</th>
            </tr>

            </thead>

            <tbody id="studentTable">

            </tbody>

        </table>

    </div>

    <!-- Classroom Config -->

    <div class="card p-4 shadow mb-4">

        <h3>Classroom Configuration</h3>

        <div class="row">

            <div class="col-md-4">

                <label>Rows of Benches</label>

                <input
                    type="number"
                    id="rows"
                    class="form-control">

            </div>

            <div class="col-md-4">

                <label>Columns of Benches</label>

                <input
                    type="number"
                    id="cols"
                    class="form-control">

            </div>

            <div class="col-md-4">

                <label>Seats Per Bench</label>

                <input
                    type="number"
                    id="capacity"
                    class="form-control">

            </div>

        </div>

        <button
            class="btn btn-success mt-3"
            onclick="generateLayout()">

            Generate Seating Arrangement

        </button>

    <div>

    <!-- Classroom -->

    <div class="card p-4 shadow">

        <h3>Classroom Top View</h3>

        <div id="classroom"></div>

    </div>

</div>
    <div class="text-center mt-4">

    <button
        class="btn btn-danger"
        onclick="printLayout()">

        Print Seating Arrangement

    </button>

</div>

<script src="script.js"></script>

</body>

</html>
